spring:
  application:
    name: discodeit
  # PostgreSQL 연결 정보
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    properties:
      # Hibernate는 코드로부터 SQL 쿼리를 생성한다.
      # 예: userRepository.findById(userId);
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG # 실행되는 SQL 출력
    # SQL 쿼리에 들어가는 변수('?', 파라미터)에 바인딩 되는 값을 출력
    org.hibernate.orm.jdbc.bind: TRACE

discodeit:
  storage:
    type: local
    local:
      root-path: ./data/files